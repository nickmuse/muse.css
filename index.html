<html data-theme="light">
    <head>
        <title>muse.css</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="muse.css">
        <link rel="stylesheet" href="bounce.css">
    </head>
    <body class="theme">
        <!--
        ##############################################################################
        NAVIGATION
        ##############################################################################
        -->
        <div class="navigation">
            <div class="nav-left">
                <a href="https://nickmuse.com"><code>muse.css</code></a>
            </div>
            <div class="nav-right">
                <p>☀︎</p>
                <label class="switch"><input name="toggle_dark" type="checkbox"><span class="slider"></span></label>
                <p>🌙︎</p>
            </div>
        </div>
        <!--
        ##############################################################################
        CONTENT
        ##############################################################################
        -->
        <div class="page-content">
            <div class="page">
                <div class="article">
                    
                    <!--
                    ##############################################################################
                    TAB BUTTON NAVIGATION
                    ##############################################################################
                    -->
                    <div class="tab_links">
                        <button class="tab_link" onclick="openTab(event,'tab_a')">&#x1F3C1;&#xFE0E;</button>
                        <button class="tab_link" onclick="openTab(event,'tab_b')">&#x1F4E1;&#xFE0E;</button>
                        <button class="tab_link" onclick="openTab(event,'tab_c')">&#x26CF;&#xFE0E;</button>
                        <button class="tab_link" onclick="openTab(event,'tab_d')">&#x1F33F;&#xFE0E;</button>
                    </div>
                    <!--
                    ##############################################################################
                    // TAB A
                    ##############################################################################
                    -->
                    <div class="tab_content" id="tab_a">
                        <!-- title-->
                        <h1>example <span class="blinking">█</span></h1>
                        <!-- image -->
                        <img class="article-media" src="hamilton.jpg" class="thumbnail"></img>
                    </div>
                    <!--
                    ###############################################################################
                    TAB B
                    ###############################################################################
                    -->
                    <div class="tab_content" id="tab_b">
                        <!-- login -->
                        <h1>stylings for common elements <span class="blinking">█</span></h1>
                        <div class="popup">
                            <div class="popup-titlebar">&#128274;&#xFE0E;&nbsp;access</div>
                            <div class="popup-content">
                                    <center>
                                        <input type="text" placeholder="username"></input><br>
                                        <input type="password" placeholder="password"></input><br>
                                        <button>login</button>
                                        <button disabled>logout</button>
                                        <label class="switch"><input name="nonsense" type="checkbox"><span class="slider"></span></label>
                                    </center>
                            </div>
                        </div>
                    </div>
                    <!--
                    ##############################################################################
                    TAB C
                    ##############################################################################
                    -->
                    <div class="tab_content" id="tab_c">
                        <!-- table -->
                        <script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
                        <h1>plays nicely with grid.js <span class="blinking">█</span></h1>
                        <div id="my-cool-table" style="width: 100%;"></div>
                        <script>
                          new gridjs.Grid({
                            columns: [
                              { name: 'Region' },
                              { name: 'Server' }
                            ],
                            data: [
                                ['North', '172.16.0.1'],
                                ['North East', '172.16.0.2'],
                                ['East', '192.168.0.1'],
                                ['South East', '192.168.0.2'],
                                ['South', '10.0.0.1'],
                                ['South West', '10.0.0.2'],
                                ['West', '10.0.0.3'],
                                ['North West', '10.0.0.4']
                            ],
                            search: true,
                            sort: true,
                            pagination: {limit:6,summary:false,buttonsCount:0,},
                            width: '100%',
                          }).render(document.getElementById("my-cool-table"));
                        </script>
                    </div>
                    <!--
                    ###############################################################################
                    TAB D
                    ###############################################################################
                    -->
                    <div class="tab_content" id="tab_d">
                        <!-- code -->
                        <h1>open-source + mit-licensed <span class="blinking">█</span></h1>
                        <a href="https://github.com/nickmuse/muse.css"><code> ~ $ git clone https://github.com/nickmuse/muse.css</code></a>
                    </div>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="toggle_dark.js"></script>
        <script type="text/javascript" src="tabs.js"></script>
    </body>
</html>
